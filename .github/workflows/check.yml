name: check
# Test only: builds the posts for one day without publishing anything.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "date in schedule.json, e.g. 2026-10-30"
        required: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build containers (no publish)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DATE: ${{ inputs.date }}
        run: |
          for id in $(python -c "import json,os;print(' '.join(p['id'] for p in json.load(open('schedule.json'))['posts'] if p['date']==os.environ['DATE']))"); do
            python scripts/publish.py --check "$id"
          done
